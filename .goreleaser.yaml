version: 2

project_name: hwcfgmap

before:
  hooks:
    - go mod tidy

builds:
  - id: hwcfgmap
    main: ./cmd/hwcfgmap
    binary: hwcfgmap
    # m1 is a pure-Go probe+synth CLI (no CGO, no llama.cpp linkage). The
    # binary runs on a 信创 box with no Go toolchain — download and go.
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: linux
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    builds: [hwcfgmap]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format: tar.gz

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-dev"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: SuperMarioYL
    name: hwcfgmap
