<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：信创/GPU 盒子 → probe 探测 → BoxProfile → synth(+ModelTarget) → ArgMatrix → llama-server 启动行">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- 静态连线（底层） -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="200" y1="180" x2="260" y2="180" marker-end="url(#ah-l)"/>
    <line x1="410" y1="180" x2="470" y2="180" marker-end="url(#ah-l)"/>
    <line x1="620" y1="180" x2="680" y2="180" marker-end="url(#ah-l)"/>
  </g>

  <!-- 行军虚线数据流（顶层，dasharray 周期 16，from 32→0 = 2 周期 → 无缝循环） -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="200" y1="180" x2="256" y2="180" stroke="#0071E3" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="410" y1="180" x2="466" y2="180" stroke="#5E5CE6" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.55s" repeatCount="indefinite"/>
    </line>
    <line x1="620" y1="180" x2="676" y2="180" stroke="#10A37F" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 数据包圆点沿连线流动 -->
  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M200,180 L256,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M410,180 L466,180" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M620,180 L676,180" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 节点：呼吸 = fill-opacity 0.10↔0.18 spline，四节点负 begin 错峰 -->
  <g>
    <rect x="50"  y="140" width="150" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#0A4F9E">信创 / GPU 盒子</text>
    <text x="125" y="196" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6E6E73">GPU · CPU · RAM · NVMe</text>

    <rect x="260" y="140" width="150" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="335" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3FC4">probe</text>
    <text x="335" y="196" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6E6E73">→ BoxProfile JSON</text>

    <rect x="470" y="140" width="150" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="545" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#0B6B53">synth</text>
    <text x="545" y="196" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6E6E73">+ModelTarget → ArgMatrix</text>

    <rect x="680" y="140" width="150" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.4s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="755" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#0A4F9E">llama-server 行</text>
    <text x="755" y="196" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6E6E73">粘贴即跑</text>
  </g>

  <!-- 静态注解（不载动画信息） -->
  <text x="440" y="278" text-anchor="middle" font-size="12" font-weight="500" fill="#6E6E73">probe 读 /proc + vendor CLI（nvidia-smi / rocm-smi / npu-smi / mthreads-smi）</text>
  <text x="440" y="298" text-anchor="middle" font-size="11" font-weight="400" fill="#6E6E73">synth 静态合成 offload · context · batch · threads · KV-cache · mlock — 不跑 token，不 exec</text>
</svg>
